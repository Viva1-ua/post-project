{% extends "base.html" %}

{% block content %}
	<h2>You have chosen {{ field.name }} as a field of interest.</h2>
  <h4></h4>
  <ul>
    {% for post in field.posts.all %}
      <li>
        <p>
          <a href="">{{ post.subtext }}</a>
        </p>
      </li>
    {% empty %}
      <p>No posts!</p>
    {% endfor %}
  </ul>
  
{% endblock %}
