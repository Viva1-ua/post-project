{% extends "base.html" %}

{% block content %}
	<h1>Are you sure you want to delete this post of yours?</h1>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" class="btn btn-danger" value="Yes, delete it.">
    <p><a class="btn btn-primary" href="{% url "post:post-detail" pk=post.pk %}">No, come back to the post.</a></p>
  </form>
{% endblock %}
